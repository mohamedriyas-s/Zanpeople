version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zanpeople-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: zanpeople
      POSTGRES_PASSWORD: zanpeople_dev_2026
      POSTGRES_DB: zanpeople_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zanpeople -d zanpeople_dev']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
